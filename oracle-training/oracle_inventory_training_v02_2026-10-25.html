<!doctype html>

<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدريب مخزون أوراكل | Oracle Inventory Training</title>
<style>
:root{--bg:#f3f1ee;--card:#fff;--ink:#1d1d1d;--mute:#5f5f5f;--pri:#c74634;--pri2:#312d2a;--ok:#1b7f3b;--bad:#c0262d;--line:#d9d5d0;--head:#312d2a;--headink:#fff;--field:#fbfaf9}
body[data-theme=modern]{--bg:#eef3fa;--pri:#1f5fbf;--pri2:#16325c;--head:#16325c;--line:#cfdaec;--field:#f7faff}
body[data-theme=dark]{--bg:#14161a;--card:#1d2026;--ink:#e8e8e8;--mute:#9aa0a8;--pri:#ff7a59;--pri2:#e8e8e8;--line:#333943;--head:#0d0f12;--field:#262a31;--ok:#4cd07a;--bad:#ff6b72}
body[data-theme=green]{--bg:#eef5ef;--pri:#2b8a4b;--pri2:#173d27;--head:#173d27;--line:#cfe2d3;--field:#f6fbf7}
body.bw{--bg:#fff;--card:#fff;--ink:#000;--mute:#333;--pri:#000;--pri2:#000;--ok:#000;--bad:#000;--line:#000;--head:#000;--headink:#fff;--field:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55}
.en{direction:ltr;text-align:left;color:var(--mute);font-size:.93em}
.ar{direction:rtl;text-align:right}
header{background:var(--head);color:var(--headink);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
header h1 .en{color:var(--headink);opacity:.8;font-size:13px;font-weight:400}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select,.tools button{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--headink);cursor:pointer;font:inherit;font-size:13px}
.tools select option{color:#000}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:6px 12px;background:var(--card);border-bottom:2px solid var(--pri)}
nav button{border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit;font-weight:600;border-bottom:3px solid transparent;line-height:1.3}
nav button .en{font-size:11px;font-weight:400;text-align:center}
nav button .ar{text-align:center}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:1100px;margin:16px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sc{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);transition:.15s}
.sc:hover{border-color:var(--pri);transform:translateY(-2px)}
.sc b{color:var(--pri)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute);margin-top:6px}
.badge.done{border-color:var(--ok);color:var(--ok)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--pri);color:var(--pri);border-radius:4px;padding:0 6px;margin-inline-start:6px}
.nav-path{font-family:Consolas,monospace;font-size:13px;background:var(--field);border:1px dashed var(--line);padding:6px 10px;border-radius:6px;direction:ltr;text-align:left;margin:8px 0}
.story{background:var(--field);border-inline-start:4px solid var(--pri);padding:10px 14px;border-radius:6px;margin:10px 0}
.win{border:2px solid var(--pri2);border-radius:6px;overflow:hidden;margin-top:12px}
.win .tb{background:var(--pri2);color:var(--bg);padding:6px 12px;font-size:13px;display:flex;justify-content:space-between;direction:ltr}
body.bw .win .tb{color:#fff}
.win .bd{padding:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.f label .en{font-weight:400;font-size:12px}
.f input,.f select{width:100%;padding:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:4px;font:inherit;direction:ltr;text-align:left}
.f.ok input,.f.ok select{border:2px solid var(--ok)}
.f.bad input,.f.bad select{border:2px dashed var(--bad);background:rgba(192,38,45,.06)}
.f .msg{font-size:12px;min-height:16px;direction:ltr;text-align:left}
.f.ok .msg{color:var(--ok)}.f.bad .msg{color:var(--bad)}
.hint{font-size:12px;color:var(--mute);display:none;margin-top:2px}
.btn{background:var(--pri);color:#fff;border:2px solid var(--pri);padding:8px 16px;border-radius:6px;cursor:pointer;font:inherit;font-weight:700;line-height:1.3}
.btn .en{color:inherit;opacity:.9;font-size:11px;font-weight:400;text-align:center}
.btn .ar{text-align:center}
body.bw .btn{background:#fff;color:#000}
.btn.ghost{background:transparent;color:var(--pri)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.why{margin-top:12px;padding:10px 14px;border:1px solid var(--ok);border-radius:6px;display:none}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
th{background:var(--field)}
td input{width:100%;padding:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:4px;font:inherit}
.cert{border:6px double var(--pri2);padding:34px;text-align:center}
.cert h2{font-size:28px;color:var(--pri);margin:0}
.cert .ar,.cert .en{text-align:center}
.cert .nm{font-size:26px;border-bottom:2px solid var(--ink);display:inline-block;min-width:260px;margin:14px 0}
.sheet{page-break-inside:avoid;border:1px solid #000;padding:10px;margin-bottom:12px}
.blank{display:inline-block;min-width:140px;border-bottom:1px solid #000;height:18px;vertical-align:bottom}
h2,h3{margin:0 0 6px}
.sub{font-size:13px;color:var(--mute)}
@media print{
 header,nav,.noprint,.row,.btn{display:none!important}
 body{background:#fff;color:#000}
 .en{color:#222}
 .card{border:1px solid #000;break-inside:avoid}
 body.printcert main>*:not(#certbox){display:none!important}
}
</style>
</head>

{id:16,tr:1,

 {k:'c2',l:P('نقل بضاعة من B01 إلى B02','Move goods from B01 to B02'),t:'sel',o:MATRIX,a:matAns('B01','B02'),h:P('انظر مدينة كل فرع في شاشة الفروع.','Check each branch city in the Branches tab.')},

var SC=buildSC();
function ans(f){return typeof f.a==='function'?f.a():f.a;}
function chk(f,v){
 if(v===''||v==null)return false;
 var a=ans(f);
 if(f.t==='num'){var n=parseFloat(String(v).replace(/,/g,''));if(isNaN(n))return false;return Math.abs(n-a)<=(f.tol||0.0001);}
 return norm(v)===norm(a);
}

function fieldHTML(sc,f,mode){
 var id='f_'+sc.id+'_'+f.k,inp;
 if(f.t==='sel'){
  var opts=f.o==='ORGS'?BR().map(function(b){return b.c;}):f.o;
  inp='<select id="'+id+'"><option value="">'+T('choose')+'</option>'+opts.map(function(o){return '<option value="'+esc(o)+'">'+esc(optLabel(o))+'</option>';}).join('')+'</select>';
 }else{inp='<input id="'+id+'" type="text" inputmode="'+(f.t==='num'?'decimal':'text')+'" autocomplete="off">';}
 var hint=(mode==='learn'&&f.h)?'<div class="hint" id="h_'+id+'">'+I(f.h)+'</div>':'';
 return '<div class="f" id="w_'+id+'"><label>'+f.l.ar+'<div class="en">'+f.l.en+'</div></label>'+inp+'<div class="msg" id="m_'+id+'"></div>'+hint+'</div>';
}

function scenarioView(sc,mode,onDone){
 var box=el('<div class="card"></div>');
 var h='<h2 style="color:var(--pri)">'+sc.id+'. '+sc.t.ar+'</h2><div class="en" style="margin-bottom:4px">'+sc.t.en+'</div>';
 h+='<div class="nav-path">'+esc(sc.path)+'</div>';
 h+='<div class="story">'+B(sc.story)+'</div>';
 h+='<div class="win"><div class="tb"><span>Oracle Applications — '+esc(sc.path.split('>').pop().trim())+'</span><span>[ Simulation ]</span></div><div class="bd">'+sc.fields.map(function(f){return fieldHTML(sc,f,mode);}).join('')+'</div></div>';
 h+='<div class="why" id="why"><b>'+T('why')+'</b>'+B(sc.why)+'</div>';
 h+='<div class="row"><button class="btn" id="bSub">'+B(S.submit)+'</button>';
 if(mode==='learn'){h+='<button class="btn ghost" id="bHint">'+B(S.hintBtn)+'</button><button class="btn ghost" id="bAns">'+B(S.ans)+'</button><button class="btn ghost" id="bRe">'+B(S.retry)+'</button>';}
 h+='<span id="res" style="font-weight:700"></span></div>';
 box.innerHTML=h;
 var locked=false;
 function run(){
  if(locked)return;
  var ok=0;
  sc.fields.forEach(function(f){
   var id='f_'+sc.id+'_'+f.k,node=box.querySelector('#'+id),w=box.querySelector('#w_'+id),m=box.querySelector('#m_'+id);
   var good=chk(f,node.value);if(good)ok++;
   w.className='f '+(good?'ok':'bad');
   m.textContent=good?(mode==='learn'?'✔ '+T('right'):'✔'):(mode==='learn'?'✘ '+T('wrong'):'✘');
  });
  var pct=Math.round(ok/sc.fields.length*100);
  box.querySelector('#res').textContent=T('score')+': '+ok+'/'+sc.fields.length+' ('+pct+'%)';
  if(mode==='learn'){
   if(pct===100)box.querySelector('#why').style.display='block';
   var prev=state.data.practice[sc.id]||0;if(pct>prev){state.data.practice[sc.id]=pct;save();}
  }else{
   locked=true;box.querySelector('#bSub').disabled=true;
   box.querySelector('#why').style.display='block';
   sc.fields.forEach(function(f){var id='f_'+sc.id+'_'+f.k;if(!chk(f,box.querySelector('#'+id).value)){var a=ans(f);box.querySelector('#m_'+id).textContent='✘ '+T('expected')+': '+(f.t==='sel'?optLabel(a):a);}});
   if(onDone)onDone(ok,sc.fields.length);
  }
 }
 box.querySelector('#bSub').onclick=run;
 if(mode==='learn'){
  box.querySelector('#bHint').onclick=function(){box.querySelectorAll('.hint').forEach(function(x){x.style.display='block';});};
  box.querySelector('#bAns').onclick=function(){sc.fields.forEach(function(f){box.querySelector('#f_'+sc.id+'_'+f.k).value=ans(f);});box.querySelector('#why').style.display='block';};
  box.querySelector('#bRe').onclick=function(){render();};
 }
 return box;
}

function pctAll(){var v=0;SC.forEach(function(s){if(state.data.practice[s.id]===100)v++;});return Math.round(v/SC.length*100);}
var main=document.getElementById('main'),navEl=document.getElementById('nav');

function renderNav(){
 var views=['home','concepts','branches','practice','exam','sheet','progress'];
 navEl.innerHTML='';
 views.forEach(function(v){var b=document.createElement('button');b.innerHTML=B(S[v]);if(state.view===v)b.className='on';b.onclick=function(){state.view=v;state.cur=null;state.exam=null;render();};navEl.appendChild(b);});
}
function renderHead(){
 document.getElementById('ttl').innerHTML='<div class="ar">'+S.title.ar+'</div><div class="en">'+S.title.en+' — '+S.sub.en+'</div>';
 document.getElementById('btnBW').textContent=document.body.classList.contains('bw')?T('bwOn'):T('bw');
 document.getElementById('btnPrint').textContent=T('print');
 var sel=document.getElementById('selTheme'),cur=document.body.getAttribute('data-theme'),keys=['classic','modern','dark','green'];
 sel.innerHTML=keys.map(function(k,i){return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+I(S.themes[i])+'</option>';}).join('');
}

function vHome(){
 var c=el('<div class="card"></div>');
 c.innerHTML='<h2>'+S.welcome.ar+'</h2><div class="en" style="margin-bottom:8px">'+S.welcome.en+'</div><div class="prog"><i style="width:'+pctAll()+'%"></i></div><p class="sub">'+T('progress')+': '+pctAll()+'% — '+T('total')+': '+SC.length+'</p><h3>'+T('rules')+'</h3><ol>'+RULES.map(function(r){return '<li>'+B(r)+'</li>';}).join('')+'</ol>';
 main.appendChild(c);
}
function vConcepts(){
 var c=el('<div class="card"></div>');
 c.innerHTML='<table><tr><th>'+T('term')+'</th><th>'+T('meaning')+'</th></tr>'+CONCEPTS.map(function(x){return '<tr><td><b>'+x.k+'</b></td><td>'+B(x)+'</td></tr>';}).join('')+'</table>';
 main.appendChild(c);
}
function vBranches(){
 var c=el('<div class="card"></div>');
 var rows=BR().map(function(b,i){
  return '<tr><td><b>'+b.c+'</b></td><td><input data-i="'+i+'" data-k="city" value="'+esc(b.city)+'" style="direction:ltr"></td><td><input data-i="'+i+'" data-k="ar" value="'+esc(b.ar)+'"></td><td><input data-i="'+i+'" data-k="en" value="'+esc(b.en)+'" style="direction:ltr"></td></tr>';
 }).join('');
 var groups={},same=0,cross=0,i,j;
 BR().forEach(function(b){var k=norm(b.city);(groups[k]=groups[k]||[]).push(b.c);});
 for(i=0;i<BR().length;i++){for(j=i+1;j<BR().length;j++){if(sameCity(BR()[i].c,BR()[j].c))same++;else cross++;}}
 var g=Object.keys(groups).map(function(k){return '<tr><td><b>'+esc(k)+'</b></td><td style="direction:ltr;text-align:left">'+groups[k].join(', ')+'</td></tr>';}).join('');
 var pol=[
  [P('بين أقسام الفرع الواحد','Between sections of one branch'),'Subinventory transfer'],
  [P('فرعان في نفس المدينة','Two branches in the same city'),'Inter-org Direct'],
  [P('فرعان في مدينتين مختلفتين','Two branches in different cities'),'Inter-org Intransit'],
  [P('فرع ينقصه صنف عند فرع آخر','A short branch asks another branch'),'Internal Requisition'],
  [P('وصول شحنة بنقص أو تلف','Shipment arrives short or damaged'),'Receive actual qty and raise discrepancy'],
  [P('شحنة مرفوضة عند الوصول','Shipment refused on arrival'),'Return to origin']
 ].map(function(r){return '<tr><td>'+B(r[0])+'</td><td><b>'+r[1]+'</b><div class="en">'+(OPT[r[1]]||'')+'</div></td></tr>';}).join('');
 c.innerHTML='<h2>'+T('brTitle')+'</h2><p class="sub">'+B(S.brNote)+'</p>'+
  '<table><tr><th>'+T('code')+'</th><th>'+T('city')+'</th><th>'+T('nAr')+'</th><th>'+T('nEn')+'</th></tr>'+rows+'</table>'+
  '<div class="row"><button class="btn ghost" id="rb">'+B(S.resetBr)+'</button></div>'+
  '<h3 style="margin-top:16px">'+T('groups')+'</h3><table><tr><th>'+T('city')+'</th><th>'+T('code')+'</th></tr>'+g+'</table>'+
  '<p>'+T('pairs')+' ('+(same+cross)+'): '+T('samePairs')+' = <b>'+same+'</b> | '+T('crossPairs')+' = <b>'+cross+'</b></p>'+
  '<h3 style="margin-top:16px">'+T('policy')+'</h3><table><tr><th>'+T('caseC')+'</th><th>'+T('how')+'</th></tr>'+pol+'</table>';
 c.querySelectorAll('input[data-i]').forEach(function(inp){
  inp.onchange=function(){BR()[+inp.getAttribute('data-i')][inp.getAttribute('data-k')]=inp.value.trim();save();SC=buildSC();render();};
 });
 c.querySelector('#rb').onclick=function(){state.data.branches=cloneBR();save();SC=buildSC();render();};
 main.appendChild(c);
}
function vPractice(){
 if(state.cur){
  var sc=SC.filter(function(s){return s.id===state.cur;})[0];
  var b=el('<div class="row noprint"><button class="btn ghost" id="bk">'+B(S.back)+'</button></div>');
  b.querySelector('#bk').onclick=function(){state.cur=null;render();};
  main.appendChild(b);main.appendChild(scenarioView(sc,'learn'));return;
 }
 var g=el('<div class="grid"></div>');
 SC.forEach(function(s){
  var done=state.data.practice[s.id]===100;
  var d=el('<div class="sc"><b>'+s.id+'.</b> '+s.t.ar+(s.tr?'<span class="tag">'+T('trans')+'</span>':'')+'<div class="en">'+s.t.en+'</div><span class="badge'+(done?' done':'')+'">'+(done?'✔ '+T('done'):T('todo'))+'</span></div>');
  d.onclick=function(){state.cur=s.id;render();};g.appendChild(d);
 });
 main.appendChild(g);
}
function vExam(){
 var ex=state.exam;
 if(!ex){
  var c=el('<div class="card"><h2>'+T('exam')+'</h2><p>'+SC.length+' '+(state.data?'':'')+'سيناريو بدون تلميحات ولا إظهار إجابات. نسبة النجاح 80%.<div class="en">'+SC.length+' scenarios, no hints or answers shown. Pass mark 80%.</div></p><label>'+T('name')+'<br><input id="nm" style="padding:8px;width:280px;max-width:100%" value="'+esc(state.data.name||'')+'"></label><div class="row"><button class="btn" id="go">'+B(S.startExam)+'</button></div></div>');
  c.querySelector('#go').onclick=function(){var n=c.querySelector('#nm').value.trim();if(!n){c.querySelector('#nm').focus();return;}state.data.name=n;save();state.exam={i:0,ok:0,tot:0,fin:false};render();};
  main.appendChild(c);return;
 }
 if(ex.fin){
  var pct=Math.round(ex.ok/ex.tot*100),passed=pct>=80;
  if(passed){state.data.exam={score:pct,date:new Date().toISOString().slice(0,10)};save();}
  main.appendChild(el('<div class="card"><h2>'+T('score')+': '+pct+'%</h2>'+B(passed?S.pass:S.fail)+'</div>'));
  if(passed)main.appendChild(certEl(state.data.name,pct,state.data.exam.date));
  return;
 }
 var sc=SC[ex.i];
 main.appendChild(el('<div class="card"><div class="prog"><i style="width:'+Math.round(ex.i/SC.length*100)+'%"></i></div><span class="sub">'+(ex.i+1)+' / '+SC.length+'</span></div>'));
 var view=scenarioView(sc,'exam',function(ok,tot){
  ex.ok+=ok;ex.tot+=tot;
  var n=el('<div class="row"><button class="btn">'+B(S.next)+'</button></div>');
  n.querySelector('button').onclick=function(){ex.i++;if(ex.i>=SC.length)ex.fin=true;render();};
  view.appendChild(n);
 });
 main.appendChild(view);
}
function certEl(name,pct,date){
 var c=el('<div id="certbox"><div class="card cert"><h2>'+S.certT.ar+'</h2><div class="en" style="font-size:16px;margin-bottom:8px">'+S.certT.en+'</div><div class="ar">'+S.certP.ar+'</div><div class="en">'+S.certP.en+'</div><div class="nm">'+esc(name)+'</div><div class="ar">'+S.certD.ar+' <b>'+pct+'%</b></div><div class="en">'+S.certD.en+' <b>'+pct+'%</b></div><p class="sub">'+date+' — Al-Munajem Foods / المنجم للأغذية</p><div class="row noprint" style="justify-content:center"><button class="btn" id="pc">'+B(S.printCert)+'</button></div></div></div>');
 c.querySelector('#pc').onclick=function(){document.body.classList.add('printcert');window.print();setTimeout(function(){document.body.classList.remove('printcert');},500);};
 return c;
}
function vSheet(){
 main.appendChild(el('<div class="card noprint">'+B(S.wsInfo)+'<div class="row"><button class="btn" onclick="window.print()">'+B(S.print)+'</button></div></div>'));
 SC.forEach(function(s){
  main.appendChild(el('<div class="sheet"><b>'+s.id+'. '+s.t.ar+'</b><div class="en">'+s.t.en+'</div><div class="nav-path">'+esc(s.path)+'</div>'+B(s.story)+'<table style="margin-top:8px">'+s.fields.map(function(f){return '<tr><td style="width:55%">'+f.l.ar+'<div class="en">'+f.l.en+'</div></td><td><span class="blank"></span></td></tr>';}).join('')+'</table></div>'));
 });
 main.appendChild(el('<div class="sheet" style="page-break-before:always"><b>'+T('key')+'</b><table style="margin-top:8px">'+SC.map(function(s){return '<tr><td style="width:32%"><b>'+s.id+'. '+s.t.ar+'</b><div class="en">'+s.t.en+'</div></td><td>'+s.fields.map(function(f){var a=ans(f);return f.l.ar+' / '+f.l.en+': <b>'+esc(f.t==='sel'?optLabel(a):a)+'</b>';}).join('<br>')+'</td></tr>';}).join('')+'</table></div>'));
}
function vProgress(){
 var c=el('<div class="card"></div>');
 var h='<table><tr><th>#</th><th>'+T('practice')+'</th><th>%</th></tr>'+SC.map(function(s){return '<tr><td>'+s.id+'</td><td>'+s.t.ar+'<div class="en">'+s.t.en+'</div></td><td>'+(state.data.practice[s.id]||0)+'%</td></tr>';}).join('')+'</table>';
 h+='<p><b>'+T('exam')+':</b> '+(state.data.exam?state.data.exam.score+'% ('+state.data.exam.date+')':'—')+'</p><div class="row"><button class="btn ghost" id="rs">'+B(S.reset)+'</button></div>';
 c.innerHTML=h;
 c.querySelector('#rs').onclick=function(){state.data={name:'',practice:{},exam:null,branches:state.data.branches};save();render();};
 main.appendChild(c);
 if(state.data.exam&&state.data.name)main.appendChild(certEl(state.data.name,state.data.exam.score,state.data.exam.date));
}

function render(){
 renderHead();renderNav();main.innerHTML='';
 var m={home:vHome,concepts:vConcepts,branches:vBranches,practice:vPractice,exam:vExam,sheet:vSheet,progress:vProgress};
 (m[state.view]||vHome)();
}
document.getElementById('btnBW').onclick=function(){document.body.classList.toggle('bw');render();};
document.getElementById('btnPrint').onclick=function(){window.print();};
document.getElementById('selTheme').onchange=function(e){document.body.setAttribute('data-theme',e.target.value);};
window.__oit={sc:function(){return SC;},ans:ans,state:state};
render();
})();
</script>

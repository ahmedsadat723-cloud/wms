var SC=buildSC();
function ans(f){return typeof f.a==='function'?f.a():f.a;}
function chk(f,v){
 if(v===''||v==null)return false;
 var a=ans(f);
 if(f.t==='num'){var n=parseFloat(String(v).replace(/,/g,''));if(isNaN(n))return false;return Math.abs(n-a)<=(f.tol||0.0001);}
 return norm(v)===norm(a);
}

function fieldHTML(sc,f,mode){
 var id='f_'+sc.id+'_'+f.k,inp;
 if(f.t==='sel'){
  var opts=f.o==='ORGS'?BR().map(function(b){return b.c;}):f.o;
  inp='<select id="'+id+'"><option value="">'+T('choose')+'</option>'+opts.map(function(o){return '<option value="'+esc(o)+'">'+esc(optLabel(o))+'</option>';}).join('')+'</select>';
 }else{inp='<input id="'+id+'" type="text" inputmode="'+(f.t==='num'?'decimal':'text')+'" autocomplete="off">';}
 var hint=(mode==='learn'&&f.h)?'<div class="hint" id="h_'+id+'">'+I(f.h)+'</div>':'';
 return '<div class="f" id="w_'+id+'"><label>'+f.l.ar+'<div class="en">'+f.l.en+'</div></label>'+inp+'<div class="msg" id="m_'+id+'"></div>'+hint+'</div>';
}

function scenarioView(sc,mode,onDone){
 var box=el('<div class="card"></div>');
 var h='<h2 style="color:var(--pri)">'+sc.id+'. '+sc.t.ar+'</h2><div class="en" style="margin-bottom:4px">'+sc.t.en+'</div>';
 h+='<div class="nav-path">'+esc(sc.path)+'</div>';
 h+='<div class="story">'+B(sc.story)+'</div>';
 h+='<div class="win"><div class="tb"><span>Oracle Applications — '+esc(sc.path.split('>').pop().trim())+'</span><span>[ Simulation ]</span></div><div class="bd">'+sc.fields.map(function(f){return fieldHTML(sc,f,mode);}).join('')+'</div></div>';
 h+='<div class="why" id="why"><b>'+T('why')+'</b>'+B(sc.why)+'</div>';
 h+='<div class="row"><button class="btn" id="bSub">'+B(S.submit)+'</button>';
 if(mode==='learn'){h+='<button class="btn ghost" id="bHint">'+B(S.hintBtn)+'</button><button class="btn ghost" id="bAns">'+B(S.ans)+'</button><button class="btn ghost" id="bRe">'+B(S.retry)+'</button>';}
 h+='<span id="res" style="font-weight:700"></span></div>';
 box.innerHTML=h;
 var locked=false;
 function run(){
  if(locked)return;
  var ok=0;
  sc.fields.forEach(function(f){
   var id='f_'+sc.id+'_'+f.k,node=box.querySelector('#'+id),w=box.querySelector('#w_'+id),m=box.querySelector('#m_'+id);
   var good=chk(f,node.value);if(good)ok++;
   w.className='f '+(good?'ok':'bad');
   m.textContent=good?(mode==='learn'?'✔ '+T('right'):'✔'):(mode==='learn'?'✘ '+T('wrong'):'✘');
  });
  var pct=Math.round(ok/sc.fields.length*100);
  box.querySelector('#res').textContent=T('score')+': '+ok+'/'+sc.fields.length+' ('+pct+'%)';
  if(mode==='learn'){
   if(pct===100)box.querySelector('#why').style.display='block';
   var prev=state.data.practice[sc.id]||0;if(pct>prev){state.data.practice[sc.id]=pct;save();}
  }else{
   locked=true;box.querySelector('#bSub').disabled=true;
   box.querySelector('#why').style.display='block';
   sc.fields.forEach(function(f){var id='f_'+sc.id+'_'+f.k;if(!chk(f,box.querySelector('#'+id).value)){var a=ans(f);box.querySelector('#m_'+id).textContent='✘ '+T('expected')+': '+(f.t==='sel'?optLabel(a):a);}});
   if(onDone)onDone(ok,sc.fields.length);
  }
 }
 box.querySelector('#bSub').onclick=run;
 if(mode==='learn'){
  box.querySelector('#bHint').onclick=function(){box.querySelectorAll('.hint').forEach(function(x){x.style.display='block';});};
  box.querySelector('#bAns').onclick=function(){sc.fields.forEach(function(f){box.querySelector('#f_'+sc.id+'_'+f.k).value=ans(f);});box.querySelector('#why').style.display='block';};
  box.querySelector('#bRe').onclick=function(){render();};
 }
 return box;
}

function pctAll(){var v=0;SC.forEach(function(s){if(state.data.practice[s.id]===100)v++;});return Math.round(v/SC.length*100);}

 main.appendChild(wrap);
 var desk=wrap.querySelector('#desk'),win=wrap.querySelector('#labWin'),snapWin=wrap.querySelector('#snapWin'),stk=wrap.querySelector('#stk'),clsBox=wrap.querySelector('#clsBox'),hlpBox=wrap.querySelector('#hlpBox'),tskb=wrap.querySelector('#tskb'),dmsg=wrap.querySelector('#dmsg');
 var lastEl=null,mt=null,curTitle=(lab.step+1)+'. '+I(st.t);
 function msg(p){dmsg.innerHTML=B(p);dmsg.style.display='block';clearTimeout(mt);mt=setTimeout(function(){dmsg.style.display='none';},4500);}
 function winItems(){
  var s='<div data-f="-1" class="'+(lab.front===-1?'on':'')+'">'+esc(curTitle)+'</div>';
  lab.wins.forEach(function(x,i){s+='<div data-f="'+i+'" class="'+(lab.front===i?'on':'')+'">'+esc(x.title)+'</div>';});
  return s;
 }
 function menuHTML(){return MENUS.map(function(m){var it=m.it==='dyn'?winItems():m.it.map(function(x){return x[0]==='-'?'<hr>':'<div data-a="'+x[2]+'">'+x[0]+'<span class="ar">'+x[1]+'</span></div>';}).join('');return '<span class="mb"><button type="button" data-m="1">'+m.en+' '+m.ar+'</button><span class="mdd">'+it+'</span></span>';}).join('');}
 function ctl(k){return '<span class="wc"><button type="button" data-w="'+k+'min" title="Minimize / تصغير">_</button><button type="button" data-w="'+k+'max" title="Maximize / تكبير">&#9634;</button><button type="button" class="x" data-w="'+k+'close" title="Close / إغلاق">&#10005;</button></span>';}
 function applyDesk(){
  var ow=win.querySelector('.ow');
  var curShown=lab.front===-1&&!lab.cm&&!lab.cc;
  win.style.display=curShown?'':'none';
  if(ow){ow.classList.toggle('max',!!lab.cx&&curShown);ow.classList.toggle('zoomed',!!lab.cz);var om=ow.querySelector('.owm');if(om)om.innerHTML=menuHTML();}
  clsBox.innerHTML=(lab.front===-1&&lab.cc)?'<div class="wclosed">'+B(P('النافذة مغلقة. أعد فتحها لإكمال الخطوة.','The window is closed. Reopen it to finish the step.'))+'<button class="btn" type="button" data-a="reopen">'+B(P('إعادة فتح','Reopen'))+'</button></div>':'';
  var bars='';
  lab.wins.forEach(function(x,i){if(lab.front!==i)bars+='<div class="ow" data-i="'+i+'"><div class="owt"><span class="tt">'+esc(x.title)+'</span><span class="wc"><button type="button" class="x" data-w="bclose" data-i="'+i+'" title="Close / إغلاق">&#10005;</button></span></div></div>';});
  if(lab.front!==-1)bars+='<div class="ow" data-i="-1"><div class="owt"><span class="tt">'+esc(curTitle)+'</span></div></div>';
  stk.innerHTML=bars;
  if(lab.front>=0&&lab.wins[lab.front]){
   var s=lab.wins[lab.front];
   snapWin.innerHTML='<div class="ow snap'+(lab.sx?' max':'')+'"><div class="owt"><span class="tt">'+esc(s.title)+'</span>'+ctl('s')+'</div><div class="snapnote">'+B(P('نافذة سابقة للعرض فقط. اضغط _ للرجوع إلى النافذة الحالية.','Previous window, view only. Press _ to go back to the current window.'))+'</div>'+s.html+'</div>';
  }else snapWin.innerHTML='';
  tskb.innerHTML=(lab.cm&&!lab.cc&&lab.front===-1)?'<button type="button" data-t="1">&#9635; '+esc(curTitle)+'</button>':'';
 }
 function decorate(){
  var ow=win.querySelector('.ow');if(!ow||ow.querySelector('.wc'))return;
  var t=ow.querySelector('.owt');t.innerHTML='<span class="tt">'+t.innerHTML+'</span>'+ctl('c');
  applyDesk();
 }
 function setCols(names){
  win.querySelectorAll('table.otable').forEach(function(tb){
   var rows=tb.rows;if(!rows.length)return;var hs=rows[0].cells,c,r;
   for(c=0;c<hs.length;c++){var hide=names.indexOf(hs[c].textContent.trim())>=0;for(r=0;r<rows.length;r++){if(rows[r].cells[c])rows[r].cells[c].classList.toggle('hcol',hide);}}
  });
 }
 function closeCur(){
  if(!lab.passed)labFail([P('أغلقت النافذة قبل إكمال الخطوة. أعد فتحها من زر إعادة فتح أو من قائمة Window.','You closed the window before finishing the step. Reopen it with the Reopen button or the Window menu.')]);
  lab.cc=1;lab.cx=0;applyDesk();
 }
 function fire(el2){el2.dispatchEvent(new Event('input',{bubbles:true}));el2.dispatchEvent(new Event('change',{bubbles:true}));}
 function act(a){
  var f=lastEl&&win.contains(lastEl)?lastEl:null,ed=f&&(f.tagName==='INPUT'||f.tagName==='SELECT')&&!f.readOnly&&f.type!=='checkbox';
  if(a==='save'){var b=win.querySelector('#tbSave');if(b)b.click();}
  else if(a==='new'){win.querySelectorAll('.owc input[type=text],.owc input:not([type])').forEach(function(i){if(!i.readOnly)i.value='';});msg(P('جديد: تم تفريغ الحقول القابلة للتعديل.','New: editable fields were cleared.'));}
  else if(a==='close'){closeCur();}
  else if(a==='exit'){msg(P('خروج: في التدريب لا نغلق أوراكل كله. استخدم ✕ لإغلاق نافذة.','Exit: in training we do not close Oracle. Use ✕ to close a window.'));}
  else if(a==='copy'||a==='cut'){if(!f||f.value===undefined){msg(P('اضغط داخل حقل أولاً.','Click inside a field first.'));return;}lab.clip=f.value;try{navigator.clipboard.writeText(f.value);}catch(e){}if(a==='cut'&&ed){f.value='';fire(f);}msg(P('تم '+(a==='cut'?'القص':'النسخ')+'.',(a==='cut'?'Cut':'Copied')+'.'));}
  else if(a==='paste'){if(!ed){msg(P('اختر حقلاً قابلاً للكتابة أولاً.','Select a writable field first.'));return;}f.value=lab.clip||'';fire(f);}
  else if(a==='cf'){if(!ed){msg(P('اختر حقلاً قابلاً للكتابة أولاً.','Select a writable field first.'));return;}f.value='';fire(f);}
  else if(a==='cr'){var scope=(f&&(f.closest('tr')||f.closest('.ctl')||f.closest('.osubb')))||win;scope.querySelectorAll('input:not([type=checkbox]):not([type=radio]),select').forEach(function(i){if(!i.readOnly){i.value='';fire(i);}});msg(P('تم مسح السجل الحالي.','Current record cleared.'));}
  else if(a==='find'){var fb=win.querySelector('#bFind');if(fb)fb.click();else msg(P('لا يوجد بحث في هذه الشاشة. افتح شاشة Find أولاً.','There is no Find on this screen. Open a Find screen first.'));}
  else if(a==='qbe'){msg(P('الاستعلام بالمثال: في أوراكل الحقيقي اضغط F11 لدخول وضع الاستعلام، اكتب الشرط، ثم Ctrl+F11 للتنفيذ.','Query By Example: in real Oracle press F11 to enter query mode, type the criteria, then Ctrl+F11 to run.'));}
  else if(a==='hd'){setCols(['Description']);}
  else if(a==='hs'){setCols(['Sec. Qty','Sec. UOM']);}
  else if(a==='sa'){setCols([]);}
  else if(a==='zoom'){lab.cz=lab.cz?0:1;applyDesk();}
  else if(a==='help'){hlpBox.innerHTML='<div class="hlp"><b>'+I(P('شرح النافذة','Window help'))+'</b>'+B(st.goal)+(guided?B(st.guide):'')+'<button class="btn ghost" type="button" data-a="hclose">'+B(P('إغلاق','Close'))+'</button></div>';}
  else if(a==='hclose'){hlpBox.innerHTML='';}
  else if(a==='reopen'){lab.cc=0;lab.cm=0;lab.front=-1;applyDesk();}
 }
 desk.addEventListener('focusin',function(e){lastEl=e.target;});
 desk.addEventListener('click',function(e){
  var t=e.target;
  desk.querySelectorAll('.mb.open').forEach(function(m){if(!m.contains(t))m.classList.remove('open');});
  var w=t.closest&&t.closest('[data-w]');
  if(w){
   var k=w.getAttribute('data-w');
   if(k==='cmin'){lab.cm=1;applyDesk();}
   else if(k==='cmax'){lab.cx=lab.cx?0:1;applyDesk();}
   else if(k==='cclose'){closeCur();}
   else if(k==='smin'){lab.front=-1;lab.sx=0;applyDesk();}
   else if(k==='smax'){lab.sx=lab.sx?0:1;applyDesk();}
   else if(k==='sclose'){lab.wins.splice(lab.front,1);lab.front=-1;lab.sx=0;applyDesk();}
   else if(k==='bclose'){lab.wins.splice(+w.getAttribute('data-i'),1);applyDesk();}
   e.stopPropagation();return;
  }
  var m=t.closest&&t.closest('[data-m]');
  if(m){var mb=m.parentNode,was=mb.classList.contains('open');desk.querySelectorAll('.mb.open').forEach(function(x){x.classList.remove('open');});if(!was)mb.classList.add('open');return;}
  var f=t.closest&&t.closest('[data-f]');
  if(f){var i=+f.getAttribute('data-f');lab.front=i;lab.sx=0;if(i===-1){lab.cc=0;lab.cm=0;}applyDesk();return;}
  var bar=t.closest&&t.closest('#stk .ow[data-i]');
  if(bar){var j=+bar.getAttribute('data-i');lab.front=j;lab.sx=0;if(j===-1){lab.cc=0;lab.cm=0;}applyDesk();return;}
  if(t.closest&&t.closest('[data-t]')){lab.cm=0;lab.front=-1;applyDesk();return;}
  var a=t.closest&&t.closest('[data-a]');
  if(a){desk.querySelectorAll('.mb.open').forEach(function(x){x.classList.remove('open');});act(a.getAttribute('data-a'));}
 });
 st.build(win);
 var tb=win.querySelector('#tbSave');
 if(tb&&!tb.onclick){tb.onclick=function(){labInfo(LS.nosave);};}
 decorate();
 try{new MutationObserver(function(){decorate();}).observe(win,{childList:true});}catch(e){}
 if(lab.passed)win.querySelectorAll('.owc').forEach(function(o){o.classList.add('frozen');});
 if(guided){wrap.querySelector('#bHintL').onclick=function(){lab.hints++;wrap.querySelector('#hintTxt').style.display='block';};}
 var nx=wrap.querySelector('#labNext');
 if(nx)nx.onclick=function(){
  var ow=win.querySelector('.ow');
  if(ow){syncAttrs(ow);var c=ow.cloneNode(true),x1=c.querySelector('.owtb'),x2=c.querySelector('.owc');lab.wins.push({title:curTitle,html:((x1?x1.outerHTML:'')+(x2?x2.outerHTML:'')).replace(/ id="[^"]*"/g,'')});if(lab.wins.length>5)lab.wins.shift();}
  lab.cm=0;lab.cx=0;lab.cc=0;lab.cz=0;lab.sx=0;lab.front=-1;
  lab.step++;lab.passed=false;lab.msgs=[];if(lab.step>=LABSTEPS.length){lab.done=true;labSaveBest();}render();
 };
 wrap.querySelector('#labRe').onclick=function(){lab=null;render();};
 labFB();
}

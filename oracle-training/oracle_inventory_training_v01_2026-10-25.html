<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle Inventory Training | تدريب مخزون أوراكل</title>
<style>
:root{--bg:#f3f1ee;--card:#fff;--ink:#1d1d1d;--mute:#6b6b6b;--pri:#c74634;--pri2:#312d2a;--ok:#1b7f3b;--bad:#c0262d;--line:#d9d5d0;--head:#312d2a;--headink:#fff;--field:#fbfaf9}
body[data-theme=modern]{--bg:#eef3fa;--pri:#1f5fbf;--pri2:#16325c;--head:#16325c;--line:#cfdaec;--field:#f7faff}
body[data-theme=dark]{--bg:#14161a;--card:#1d2026;--ink:#e8e8e8;--mute:#9aa0a8;--pri:#ff7a59;--pri2:#e8e8e8;--line:#333943;--head:#0d0f12;--field:#262a31;--ok:#4cd07a;--bad:#ff6b72}
body[data-theme=green]{--bg:#eef5ef;--pri:#2b8a4b;--pri2:#173d27;--head:#173d27;--line:#cfe2d3;--field:#f6fbf7}
body.bw{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--pri:#000;--pri2:#000;--ok:#000;--bad:#000;--line:#000;--head:#000;--headink:#fff;--field:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
header{background:var(--head);color:var(--headink);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
header h1 small{display:block;font-weight:400;opacity:.75;font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools select,.tools button{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--headink);cursor:pointer;font:inherit;font-size:13px}
.tools select option{color:#000}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 14px;background:var(--card);border-bottom:2px solid var(--pri)}
nav button{border:0;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:1100px;margin:16px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sc{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);transition:.15s}
.sc:hover{border-color:var(--pri);transform:translateY(-2px)}
.sc b{color:var(--pri)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mute)}
.badge.done{border-color:var(--ok);color:var(--ok)}
.nav-path{font-family:Consolas,monospace;font-size:13px;background:var(--field);border:1px dashed var(--line);padding:6px 10px;border-radius:6px;direction:ltr;text-align:left;margin:8px 0}
.story{background:var(--field);border-inline-start:4px solid var(--pri);padding:10px 14px;border-radius:6px;margin:10px 0}
.win{border:2px solid var(--pri2);border-radius:6px;overflow:hidden;margin-top:12px}
.win .tb{background:var(--pri2);color:var(--bg);padding:6px 12px;font-size:13px;display:flex;justify-content:space-between;direction:ltr}
body.bw .win .tb{color:#fff}
.win .bd{padding:14px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.f input,.f select{width:100%;padding:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:4px;font:inherit;direction:ltr;text-align:left}
.f.ok input,.f.ok select{border:2px solid var(--ok)}
.f.bad input,.f.bad select{border:2px dashed var(--bad);background:rgba(192,38,45,.06)}
.f .msg{font-size:12px;min-height:16px}
.f.ok .msg{color:var(--ok)}.f.bad .msg{color:var(--bad)}
.hint{font-size:12px;color:var(--mute)}
.btn{background:var(--pri);color:#fff;border:2px solid var(--pri);padding:9px 18px;border-radius:6px;cursor:pointer;font:inherit;font-weight:700}
body.bw .btn{background:#fff;color:#000}
.btn.ghost{background:transparent;color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.why{margin-top:12px;padding:10px 14px;border:1px solid var(--ok);border-radius:6px;display:none}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid var(--line);padding:7px 10px;text-align:start;vertical-align:top}
th{background:var(--field)}
.cert{border:6px double var(--pri2);padding:34px;text-align:center}
.cert h2{font-size:30px;color:var(--pri);margin:0}
.cert .nm{font-size:26px;border-bottom:2px solid var(--ink);display:inline-block;min-width:260px;margin:14px 0}
.sheet{page-break-inside:avoid;border:1px solid #000;padding:10px;margin-bottom:12px}
.blank{display:inline-block;min-width:120px;border-bottom:1px solid #000;height:18px;vertical-align:bottom}
.only-print{display:none}
@media print{
 header,nav,.noprint,.row,.btn{display:none!important}
 .only-print{display:block}
 body{background:#fff;color:#000}
 .card{border:1px solid #000;break-inside:avoid}
 body.printcert main>*:not(#certbox){display:none!important}
}
</style>

function norm(s){return String(s).trim().toUpperCase();}
function chk(f,v){
 if(v===''||v==null)return false;
 if(f.t==='num'){var n=parseFloat(String(v).replace(/,/g,''));if(isNaN(n))return false;return Math.abs(n-f.a)<=(f.tol||0.0001);}
 return norm(v)===norm(f.a);
}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function fieldHTML(sc,f,mode){
 var id='f_'+sc.id+'_'+f.k,inp;
 if(f.t==='sel'){inp='<select id="'+id+'"><option value="">'+T('choose')+'</option>'+f.o.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>';}
 else{inp='<input id="'+id+'" type="'+(f.t==='num'?'text':'text')+'" inputmode="'+(f.t==='num'?'decimal':'text')+'" autocomplete="off">';}
 var hint=(mode==='learn'&&f.h)?'<span class="hint" style="display:none" id="h_'+id+'">'+t(f.h)+'</span>':'';
 return '<div class="f" id="w_'+id+'"><label>'+t(f.l)+'</label>'+inp+'<div class="msg" id="m_'+id+'"></div>'+hint+'</div>';
}

function scenarioView(sc,mode,onDone){
 var box=el('<div class="card"></div>');
 var h='<h2 style="margin:0 0 4px;color:var(--pri)">'+sc.id+'. '+t(sc.t)+'</h2>';
 h+='<div class="nav-path">'+esc(sc.path)+'</div>';
 h+='<div class="story">'+t(sc.story)+'</div>';
 h+='<div class="win"><div class="tb"><span>Oracle Applications — '+esc(sc.path.split('>').pop().trim())+'</span><span>[ Simulation ]</span></div><div class="bd">'+sc.fields.map(function(f){return fieldHTML(sc,f,mode);}).join('')+'</div></div>';
 h+='<div class="why" id="why"><b>'+T('why')+'</b> '+t(sc.why)+'</div>';
 h+='<div class="row"><button class="btn" id="bSub">'+T('submit')+'</button>';
 if(mode==='learn'){h+='<button class="btn ghost" id="bHint">'+T('hintBtn')+'</button><button class="btn ghost" id="bAns">'+T('ans')+'</button><button class="btn ghost" id="bRe">'+T('retry')+'</button>';}
 h+='<span id="res" style="align-self:center;font-weight:700"></span></div>';
 box.innerHTML=h;
 var locked=false;
 function run(){
  if(locked)return;
  var ok=0;
  sc.fields.forEach(function(f){
   var id='f_'+sc.id+'_'+f.k,node=box.querySelector('#'+id),w=box.querySelector('#w_'+id),m=box.querySelector('#m_'+id);
   var good=chk(f,node.value);if(good)ok++;
   w.className='f '+(good?'ok':'bad');
   if(mode==='learn'){m.textContent=good?'✔ '+T('right'):'✘ '+T('wrong');}
   else{m.textContent=good?'✔':'✘';}
  });
  var pct=Math.round(ok/sc.fields.length*100);
  box.querySelector('#res').textContent=T('score')+': '+ok+'/'+sc.fields.length+' ('+pct+'%)';
  if(mode==='learn'){
   if(pct===100)box.querySelector('#why').style.display='block';
   var prev=state.data.practice[sc.id]||0;if(pct>prev){state.data.practice[sc.id]=pct;save();}
  }else{
   locked=true;box.querySelector('#bSub').disabled=true;
   box.querySelector('#why').style.display='block';
   sc.fields.forEach(function(f){var id='f_'+sc.id+'_'+f.k;if(!chk(f,box.querySelector('#'+id).value)){box.querySelector('#m_'+id).textContent='✘ '+T('expected')+f.a;}});
   onDone&&onDone(ok,sc.fields.length);
  }
 }
 box.querySelector('#bSub').onclick=run;
 if(mode==='learn'){
  box.querySelector('#bHint').onclick=function(){box.querySelectorAll('.hint').forEach(function(x){x.style.display='block';});};
  box.querySelector('#bAns').onclick=function(){sc.fields.forEach(function(f){var n=box.querySelector('#f_'+sc.id+'_'+f.k);n.value=f.a;});box.querySelector('#why').style.display='block';};
  box.querySelector('#bRe').onclick=function(){render();};
 }
 return box;
}

function pctAll(){var v=Object.keys(state.data.practice).length?SC.reduce(function(a,s){return a+(state.data.practice[s.id]===100?1:0);},0):0;return Math.round(v/SC.length*100);}

var main=document.getElementById('main'),navEl=document.getElementById('nav');
function renderNav(){
 var views=['home','concepts','practice','exam','sheet','progress'];
 navEl.innerHTML='';
 views.forEach(function(v){var b=document.createElement('button');b.textContent=T(v);if(state.view===v)b.className='on';b.onclick=function(){state.view=v;state.cur=null;state.exam=null;render();};navEl.appendChild(b);});
}
function renderHead(){
 document.getElementById('ttl').innerHTML=T('title')+'<small>'+T('sub')+'</small>';
 document.getElementById('btnBW').textContent=document.body.classList.contains('bw')?T('bwOn'):T('bw');
 document.getElementById('btnLang').textContent=T('langBtn');
 document.getElementById('btnPrint').textContent=T('print');
 var sel=document.getElementById('selTheme'),cur=document.body.getAttribute('data-theme'),keys=['classic','modern','dark','green'];
 sel.innerHTML=keys.map(function(k,i){return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+S.themes[state.lang][i]+'</option>';}).join('');
 document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
 document.title=T('title');
}

function vHome(){
 var c=el('<div class="card"></div>');
 c.innerHTML='<h2 style="margin-top:0">'+T('welcome')+'</h2><div class="prog"><i style="width:'+pctAll()+'%"></i></div><p class="hint">'+T('progress')+': '+pctAll()+'%</p><h3>'+T('rules')+'</h3><ol>'+RULES[state.lang].map(function(r){return '<li>'+r+'</li>';}).join('')+'</ol>';
 main.appendChild(c);
}
function vConcepts(){
 var c=el('<div class="card"></div>');
 c.innerHTML='<table><tr><th>Term</th><th>'+(state.lang==='ar'?'الشرح':'Meaning')+'</th></tr>'+CONCEPTS.map(function(x){return '<tr><td><b>'+x.k+'</b></td><td>'+x[state.lang]+'</td></tr>';}).join('')+'</table>';
 main.appendChild(c);
}
function vPractice(){
 if(state.cur){
  var sc=SC.filter(function(s){return s.id===state.cur;})[0];
  var b=el('<div class="row noprint"><button class="btn ghost" id="bk">'+T('back')+'</button></div>');
  b.querySelector('#bk').onclick=function(){state.cur=null;render();};
  main.appendChild(b);main.appendChild(scenarioView(sc,'learn'));return;
 }
 var g=el('<div class="grid"></div>');
 SC.forEach(function(s){
  var done=state.data.practice[s.id]===100;
  var d=el('<div class="sc"><b>'+s.id+'.</b> '+t(s.t)+'<br><span class="badge'+(done?' done':'')+'">'+(done?'✔ '+T('done'):T('todo'))+'</span></div>');
  d.onclick=function(){state.cur=s.id;render();};g.appendChild(d);
 });
 main.appendChild(g);
}
function vExam(){
 var ex=state.exam;
 if(!ex){
  var c=el('<div class="card"><h2 style="margin-top:0">'+T('exam')+'</h2><p>'+T('examInfo')+'</p><label>'+T('name')+'<br><input id="nm" style="padding:8px;width:280px;max-width:100%" value="'+esc(state.data.name||'')+'"></label><div class="row"><button class="btn" id="go">'+T('startExam')+'</button></div></div>');
  c.querySelector('#go').onclick=function(){var n=c.querySelector('#nm').value.trim();if(!n){c.querySelector('#nm').focus();return;}state.data.name=n;save();state.exam={i:0,ok:0,tot:0,fin:false,answered:false};render();};
  main.appendChild(c);return;
 }
 if(ex.fin){
  var pct=Math.round(ex.ok/ex.tot*100),passed=pct>=80;
  if(passed){state.data.exam={score:pct,date:new Date().toISOString().slice(0,10)};save();}
  var r=el('<div class="card"><h2 style="margin-top:0">'+T('score')+': '+pct+'% — '+(passed?T('pass'):T('fail'))+'</h2></div>');
  main.appendChild(r);
  if(passed){main.appendChild(certEl(state.data.name,pct,state.data.exam.date));}
  return;
 }
 var sc=SC[ex.i];
 var bar=el('<div class="card"><div class="prog"><i style="width:'+Math.round(ex.i/SC.length*100)+'%"></i></div><span class="hint">'+(ex.i+1)+' / '+SC.length+'</span></div>');
 main.appendChild(bar);
 var view=scenarioView(sc,'exam',function(ok,tot){
  ex.ok+=ok;ex.tot+=tot;
  var n=el('<div class="row"><button class="btn">'+T('next')+'</button></div>');
  n.querySelector('button').onclick=function(){ex.i++;if(ex.i>=SC.length)ex.fin=true;render();};
  view.appendChild(n);
 });
 main.appendChild(view);
}
function certEl(name,pct,date){
 var c=el('<div id="certbox"><div class="card cert"><h2>'+T('certT')+'</h2><p>'+T('certP')+'</p><div class="nm">'+esc(name)+'</div><p>'+T('certD')+' <b>'+pct+'%</b></p><p class="hint">'+date+' — Al-Munajem Foods</p><div class="row noprint" style="justify-content:center"><button class="btn" id="pc">'+T('printCert')+'</button></div></div></div>');
 c.querySelector('#pc').onclick=function(){document.body.classList.add('printcert');window.print();setTimeout(function(){document.body.classList.remove('printcert');},500);};
 return c;
}
function vSheet(){
 var top=el('<div class="card noprint"><p>'+(state.lang==='ar'?'ورقة تمارين للطباعة (تعمل بالأبيض والأسود). مفتاح الإجابات في الصفحة الأخيرة.':'Printable worksheet (B&W friendly). Answer key on the last page.')+'</p><div class="row"><button class="btn" onclick="window.print()">'+T('print')+'</button></div></div>');
 main.appendChild(top);
 SC.forEach(function(s){
  var d=el('<div class="sheet"><b>'+s.id+'. '+t(s.t)+'</b><div class="nav-path">'+esc(s.path)+'</div><div>'+t(s.story)+'</div><table style="margin-top:8px">'+s.fields.map(function(f){return '<tr><td style="width:40%">'+t(f.l)+'</td><td><span class="blank"></span></td></tr>';}).join('')+'</table></div>');
  main.appendChild(d);
 });
 var k=el('<div class="sheet" style="page-break-before:always"><b>'+T('key')+'</b><table style="margin-top:8px">'+SC.map(function(s){return '<tr><td style="width:30%"><b>'+s.id+'. '+t(s.t)+'</b></td><td>'+s.fields.map(function(f){return t(f.l)+': <b>'+esc(f.a)+'</b>';}).join(' | ')+'</td></tr>';}).join('')+'</table></div>');
 main.appendChild(k);
}
function vProgress(){
 var c=el('<div class="card"></div>');
 var h='<table><tr><th>#</th><th>'+T('practice')+'</th><th>%</th></tr>'+SC.map(function(s){return '<tr><td>'+s.id+'</td><td>'+t(s.t)+'</td><td>'+(state.data.practice[s.id]||0)+'%</td></tr>';}).join('')+'</table>';
 h+='<p><b>'+T('exam')+':</b> '+(state.data.exam?state.data.exam.score+'% ('+state.data.exam.date+')':'—')+'</p><div class="row"><button class="btn ghost" id="rs">'+T('reset')+'</button></div>';
 c.innerHTML=h;
 c.querySelector('#rs').onclick=function(){state.data={name:'',practice:{},exam:null};save();render();};
 main.appendChild(c);
 if(state.data.exam&&state.data.name)main.appendChild(certEl(state.data.name,state.data.exam.score,state.data.exam.date));
}

function render(){
 renderHead();renderNav();main.innerHTML='';
 var m={home:vHome,concepts:vConcepts,practice:vPractice,exam:vExam,sheet:vSheet,progress:vProgress};
 (m[state.view]||vHome)();
}
document.getElementById('btnLang').onclick=function(){state.lang=state.lang==='ar'?'en':'ar';save();render();};
document.getElementById('btnBW').onclick=function(){document.body.classList.toggle('bw');render();};
document.getElementById('btnPrint').onclick=function(){window.print();};
document.getElementById('selTheme').onchange=function(e){document.body.setAttribute('data-theme',e.target.value);};
render();
})();
</script>
